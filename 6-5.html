<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div id="container" style="width: 480px; margin : 40px auto"></div>
	<h1>회원가입을 환영합니다</h1>
	<form action="">
		<fieldset>
			<legend>사용자 정보</legend>
			<label for="uname">이름</label>
			<input type="text" id="uname">
			<br>
			<label for =input id>이메일</label>
			<input type="email" id="umail">
			<br>
			<label for="uage">나이</label>
			<input type="number" id="uage">
			<br>
			<label for="fre">방문빈도</label>
			<input type="range" min="1" max="200">
			<br>
			<label>생년월일</label>
			<input type="date">
			<br>
			</fieldset>
			<br>
			<fieldset>
				<label>이벤트와 새로운 소식</label>
				<input type="radio" name="mail">메일 수신
				<input type="radio" name="unmail">메일 수신 안함
			</fieldset>
			<br>
			<input type="submit">가입하기
			<input type="reset">취소
			<button on onclick="window.open('notice.html')">공지열기</button>

			<br><br>
			<fieldset><legend>파일열기</legend>
				<input type="file">
			</fieldset>
	</form>
</body>
</html>
