<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레드향 주문하기</title>
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>배송 정보</legend>
            <ul>
                <li>
                    <label>이름</label>
                    <input type="text">
                </li>
                <li>
                    <label>배송 주소</label>
                    <input type="text">
                </li>
                <li>
                    <label>이메일</label>
                    <input type="text">
                </li>
                <li>
                    <label>연락처</label>
                    <input type="text">
                </li>
                <li>
                    <label>배송 지정</label>
                    <input type="date">(주문일로부터 최소 3일 이후)
                </li>
                <li>
                    <div>메모</div>
                    <textarea></textarea>
                </li>
            </ul>
        </fieldset>
        <br>
        <h3>주문할 상품을 선택해 주세요.</h3>
        <select>
            <option selected>레드향 특</option>
            <option>레드향 상</option>
            <option>레드향 중</option>
            <option>레드향 소</option>
        </select>
        <br>
        <ul>
            <li>
                <label><input type="checkbox"></label>
            </li>
        </ul>
    </form>
</body>
</html>
